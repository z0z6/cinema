<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kino VR</title>
<link rel="stylesheet" href="style.css">

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="intro">
  <div class="intro-panel">
    <h1>Kino VR</h1>
    <p>Statyczny obserwator w wirtualnej sali kinowej</p>
    <button id="start-vr" class="mode-btn">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="10" rx="4.5"/><circle cx="8.2" cy="12" r="2"/><circle cx="15.8" cy="12" r="2"/><path d="M10.2 12h3.6"/></svg>
      <span>Wejdź do VR</span>
    </button>
    <p class="hint">Wymaga urządzenia mobilnego z obsługą WebXR</p>
  </div>
</div>

<div id="hud" class="hidden">
  <button id="exit-vr" class="hud-btn">✕ Wyjdź z VR</button>
  <div id="video-caption" class="hidden"></div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
